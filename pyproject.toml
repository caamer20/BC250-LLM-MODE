[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bc250-llm-mode"
version = "0.9.0.dev0"
description = "Native Bazzite and CachyOS appliance for AMD BC-250 local LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "gguf>=0.17",
  "httpx>=0.27",
  "prompt-toolkit>=3.0",
  "rich>=13.7",
]

[project.scripts]
bc250-llm-mode = "bc250_llm_mode.__main__:cli"

# Explicit discovery: stray top-level directories (e.g. untracked scratch
# folders) must never be picked up as packages by flat-layout auto-discovery.
# U0.5: every importable production subpackage must appear here; the
# architecture guard enumerates them so this list cannot silently rot.
[tool.setuptools]
packages = [
  "bc250_llm_mode",
  "bc250_llm_mode.gui",
  "bc250_llm_mode.operations",
]

[tool.setuptools.package-data]
bc250_llm_mode = ["assets/*.svg"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
  "slow: long-running verification gates run explicitly in the session battery (e.g. clean-wheel smoke)",
  "release_gate_v2: evidence-driven release-gate tests (C0 red gates, turned green by C1 and folded into the default suite)",
]
