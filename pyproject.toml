[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bc250-llm-mode"
version = "0.6.1"
description = "Native Bazzite setup wizard and terminal chat for AMD BC-250 local LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "gguf>=0.17",
  "httpx>=0.27",
  "prompt-toolkit>=3.0",
  "rich>=13.7",
]

[project.scripts]
bc250-llm-mode = "bc250_llm_mode.__main__:cli"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
