name: Release

# C3.2 + G4 (RELEASE_GATE_AND_PIPELINE_REMEDIATION plan): the release pipeline
# is SEPARATE from unprivileged CI. It checks out the exact candidate ref,
# builds the candidate artifacts exactly once, emits the COMPLETE release set
# (wheel, sdist, checksums, SBOM, inventory v2, decision-derived manifest),
# verifies everything, attests, VERIFIES the attestations, runs the
# authoritative release evaluator as the final gate, and publishes only
# through an approval-gated environment using a short-lived identity. The
# publish job NEVER rebuilds — it retrieves the exact previously built
# artifacts and re-verifies the manifest + digests before upload. Publication
# has NOT been performed; it requires an eligible final evaluation,
# environment approval, and explicit owner authorization (plan §1.3, C8).

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Candidate version to release (must match pyproject)"
        required: true
        type: string
      candidate_ref:
        description: "Full ref carrying the candidate (refs/heads/… or refs/tags/v…)"
        required: true
        type: string
      qualification_level:
        description: "Qualification level the evaluator must reach"
        required: true
        type: choice
        options: [rc, final]

# Least privilege by default: every job reads the repository only. The ONLY
# write/attest/publish permissions are granted job-specifically below, and
# `id-token: write` (OIDC) exists solely on the two attestation jobs and publication preparation.
permissions:
  contents: read

env:
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  CANDIDATE_REF: ${{ inputs.candidate_ref }}
  QUALIFICATION_LEVEL: ${{ inputs.qualification_level }}

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref }}
      - name: Resolve and bind dispatch source once
        id: identity
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          git check-ref-format "$CANDIDATE_REF"
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$CANDIDATE_REF" = "$GITHUB_REF"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install with test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r release/constraints/python-3.11.txt
          python -m pip install --no-deps --no-build-isolation -e '.[test]'
      - name: Version matches candidate input
        run: |
          python - <<'PY'
          from bc250_llm_mode import __version__
          import os
          want = os.environ["CANDIDATE_VERSION"]
          assert __version__ == want, f"version drift: {__version__} != {want}"
          PY
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      - name: Documentation/version/policy consistency
        run: python -m pytest tests/test_release_tooling.py -q
      - name: Full default suite + slow/security/clean-wheel gates
        run: |
          PYTHONPATH=. pytest tests --collect-only -q
          PYTHONPATH=. pytest -q
          PYTHONPATH=. pytest -m slow -q

  build-once:
    runs-on: ubuntu-latest
    needs: [validate-candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build wheel + sdist exactly once
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r release/constraints/python-3.11.txt
          python -m build --no-isolation
      - name: Emit the complete release set (checksums, SBOM, inventory, manifest)
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          export PYTHONPATH=.
          COMMIT=$(git rev-parse HEAD)
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.release.artifacts import build_inventory
          import os
          from tools.release.sbom import build_sbom, installed_dependencies, Component
          from bc250_llm_mode.openwebui_runtime import OPENWEBUI_IMAGE_DIGEST, OPENWEBUI_IMAGE_VERSION
          dist = Path("dist")
          inv = build_inventory(dist)
          (dist / "checksums.sha256").write_text(
              "".join(f"{a.sha256}  {a.name}\n" for a in inv.artifacts))
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          deps = installed_dependencies()
          wheel = next(a for a in inv.artifacts if a.name.endswith(".whl"))
          sbom = build_sbom(
              package_name="bc250-llm-mode",
              package_version=os.environ["CANDIDATE_VERSION"],
              dependencies=deps,
              container_refs=[Component(name="open-webui", version=OPENWEBUI_IMAGE_VERSION,
                                        kind="container", sha256=OPENWEBUI_IMAGE_DIGEST.removeprefix("sha256:"))],
              subject_sha256=wheel.sha256)
          (dist / "sbom.cdx.json").write_text(
              json.dumps(sbom, sort_keys=True, indent=2))
          # inventory v2 (roles + canonical digest) over the complete set
          inv2 = build_inventory(dist)
          (dist / "inventory.json").write_text(
              json.dumps(inv2.to_dict(), sort_keys=True, indent=2))
          print("inventory:", [a.name for a in inv2.artifacts])
          PY
          # decision-derived release-manifest (draft; BLOCKED until the
          # evaluator sees the full verified evidence set)
          python -m tools.release manifest \
            --candidate "$CANDIDATE_VERSION" \
            --source-commit "$COMMIT" \
            --source-ref "$CANDIDATE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts dist \
            --output dist/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/

  verify-artifacts:
    runs-on: ubuntu-latest
    needs: [validate-candidate, build-once]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install exact wheel from job artifact + smoke CLI/worker
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install --require-hashes --only-binary=:all: -r release/constraints/python-3.11.txt
          /tmp/verify-venv/bin/pip install --no-deps dist/*.whl
          /tmp/verify-venv/bin/bc250-llm-mode --version
          /tmp/verify-venv/bin/python -m bc250_llm_mode.worker_main --help
      - name: Full artifact verification (inventory, checksums, SBOM subject == wheel digest)
        run: |
          export PYTHONPATH=.
          python -m tools.release verify dist/release-manifest.json dist

  attest:
    runs-on: ubuntu-latest
    needs: [validate-candidate, verify-artifacts]
    # Attestations bind the artifact subject digest to build provenance. Every
    # attestation is VERIFIED by the verify-attestations job below before the
    # approval environment — an attestation that is never verified does not
    # satisfy the gate.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - name: Attest build provenance (wheel + sdist + SBOM)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json

  verify-attestations:
    # G4.6: post-attestation verification BEFORE the approval environment —
    # repository, workflow identity, and subject digests are all checked.
    runs-on: ubuntu-latest
    needs: [validate-candidate, attest]
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - name: Verify attested subject digests against the checksums file
        run: cd dist && sha256sum -c checksums.sha256
      - name: Verify build-provenance attestations (repo + workflow identity)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-candidate.outputs.source_sha }}
        run: |
          mkdir -p provenance
          for subject in dist/*.whl dist/*.tar.gz dist/sbom.cdx.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" \
              --source-ref "$CANDIDATE_REF" --deny-self-hosted-runners --format json \
              > "provenance/$(basename "$subject").json"
            test "$(wc -c < "provenance/$(basename "$subject").json")" -le 4194304
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-provenance
          path: provenance/
          if-no-files-found: error

  final-evaluation:
    # G4.7: the authoritative release evaluator is the gate that BOTH the
    # approval environment and publish depend on — environment approval can
    # never override the evaluator.
    runs-on: ubuntu-latest
    needs: [validate-candidate, verify-attestations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install candidate tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r release/constraints/python-3.11.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run the authoritative release evaluator
        run: |
          export PYTHONPATH=.
          COMMIT=$(git rev-parse HEAD)
          python -m tools.release evaluate \
            --candidate "$CANDIDATE_VERSION" \
            --source-commit "$COMMIT" \
            --source-ref "$CANDIDATE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts dist \
            --level "$QUALIFICATION_LEVEL" \
            --evidence release/evidence \
            --output decision/release-decision.json \
            --manifest-output decision/release-manifest.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-decision
          path: decision/
          if-no-files-found: error

  attest-decision:
    # Decision/manifest are separate subjects, never members of their own inventory.
    runs-on: ubuntu-latest
    needs: [validate-candidate, final-evaluation]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-decision
          path: decision/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            decision/release-decision.json
            decision/release-manifest.json
      - name: Verify decision and manifest provenance before approval
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate-candidate.outputs.source_sha }}
        run: |
          mkdir -p decision-provenance
          for subject in decision/release-decision.json decision/release-manifest.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" \
              --source-ref "$CANDIDATE_REF" --deny-self-hosted-runners --format json \
              > "decision-provenance/$(basename "$subject").json"
            test "$(wc -c < "decision-provenance/$(basename "$subject").json")" -le 4194304
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-decision-provenance
          path: decision-provenance/
          if-no-files-found: error

  approval-environment:
    # Required maintainer approval before publication. The environment gate is
    # configured in the repository settings with required reviewers. It runs
    # ONLY after the final evaluation is eligible — approval can never
    # override the evaluator.
    runs-on: ubuntu-latest
    needs: [final-evaluation, attest-decision]
    environment: release-approval
    steps:
      - run: echo "Release approved by maintainer; proceeding to publish."

  publish:
    runs-on: ubuntu-latest
    needs: [validate-candidate, approval-environment]
    environment: release-approval
    # OIDC `id-token: write` exists here for short-lived Trusted
    # Publishing identity. No long-lived API token is used.
    permissions:
      contents: read
      id-token: write
    steps:
      # Retrieve the EXACT previously built artifacts — NEVER rebuild here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-decision
          path: decision/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-provenance
          path: provenance/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install candidate tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r release/constraints/python-3.11.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Consume the decision — full manifest + artifact re-verification
        # G4.8: publication consumes the release decision through the same
        # full-comparison verification (inventory equality, checksums, SBOM
        # subject == actual wheel digest, manifest digest integrity).
        run: |
          export PYTHONPATH=.
          (cd decision && sha256sum -c release-decision.json.sha256)
          python -m tools.release verify decision/release-manifest.json dist
      - name: Release-state blocker — final evaluation must be eligible
        # The refusal is a release-state blocker (the evaluator), never a
        # bypassable shell line: without the full verified evidence set this
        # step exits non-zero and nothing is published.
        run: |
          export PYTHONPATH=.
          COMMIT=$(git rev-parse HEAD)
          python -m tools.release evaluate \
            --candidate "$CANDIDATE_VERSION" \
            --source-commit "$COMMIT" \
            --source-ref "$CANDIDATE_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts dist \
            --level final \
            --evidence release/evidence \
            --output rechecked/release-decision.json
          cmp decision/release-decision.json rechecked/release-decision.json
      - name: Publication (owner-authorized; not yet performed)
        # Reached only with an eligible FINAL evaluation plus environment
        # approval. The actual PyPI Trusted Publishing / GitHub Releases
        # upload is the owner-authorized C8 act and has NOT been performed.
        run: |
          echo "Eligible final evaluation + environment approval reached."
          echo "The upload step is added only with explicit owner authorization (C8)."
          echo "No package has been published by this workflow."
