name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux is the supported runtime; macOS is a development smoke target.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Compile check
        run: python -m compileall -q bc250_llm_mode tests

      - name: Package/version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          from bc250_llm_mode import __version__
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          assert f'version = "{__version__}"' in text, "pyproject version drift"
          print("version:", __version__)
          PY

      - name: Unit and component tests
        run: PYTHONPATH=. pytest -q

      - name: CLI smoke from installed package
        run: |
          bc250-llm-mode --version
          bc250-llm-mode --help
          python -c "import bc250_llm_mode.gui" && echo "gui import ok"

      - name: Secret scan (no hardcoded tokens in source)
        run: |
          ! grep -rInE 'hf_[A-Za-z0-9]{20,}' bc250_llm_mode/ --include='*.py'

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into clean environment and smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/bc250-llm-mode --version
          /tmp/wheel-venv/bin/python -c "import bc250_llm_mode; print('wheel import ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
